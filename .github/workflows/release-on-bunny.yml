name: Deploy Frontend to Bunny CDN

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: https://ampcoin-50q9kxt9.b4a.run
        run: npm run build

      - name: Deploy to Bunny CDN Storage
        uses: BunnyWay/actions/pull-zone-cdn-action@main
        env:
          BUNNYY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNYY_ZONE_NAME: ${{ secrets.BUNNY_ZONE_NAME }}
          BUNNYY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNYY_STORAGE_ACCESSKEY: ${{ secrets.BUNNY_STORAGE_ACCESSKEY }}
        with:
          sourceDir: "frontend/build/"
